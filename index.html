<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SCT ― 状況判断訓練ツール｜防災士向け</title>
<meta name="description" content="Speed & Correct Trainer（SCT）。防災士向けの状況判断訓練ツール。災害別の状況判断を、速く正確に。">
<style>
  :root{
    --ink:#16212b; --sub:#5b6b78; --line:#dbe3ea; --bg:#eef2f5; --panel:#ffffff;
    --navy:#0f2c4a; --navy2:#173e63; --teal:#2f7d78; --flame:#e8541e; --green:#1f9d57; --red:#d24b3e; --amber:#e0902a;
    --shadow:0 4px 16px rgba(20,45,70,.10);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;color:var(--ink);background:var(--bg);line-height:1.7}
  .wrap{max-width:720px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
  header{background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;padding:16px 20px}
  .head-in{display:flex;align-items:center;justify-content:center;gap:16px;max-width:640px;margin:0 auto}
  .head-logo{width:74px;height:74px;flex:none;filter:drop-shadow(0 2px 6px rgba(0,0,0,.35))}
  .head-txt{text-align:left}
  @media(max-width:420px){
    .head-in{gap:12px}
    .head-logo{width:60px;height:60px}
  }
  header .en{font-size:11px;letter-spacing:.22em;color:#9fd0cc;font-weight:700}
  header h1{font-size:20px;font-weight:800;margin:2px 0 3px;letter-spacing:.04em}
  header .jp{font-size:12px;color:#cfe0ea}
  header .abbr{color:var(--flame);font-weight:900}
  main{flex:1;padding:18px 16px 40px}

  /* 共通 */
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:18px;margin-bottom:14px}
  .btn{display:block;width:100%;border:0;border-radius:11px;padding:15px;font-size:16px;font-weight:800;cursor:pointer;font-family:inherit;transition:.12s}
  .btn:active{transform:scale(.98)}
  .btn-primary{background:var(--navy);color:#fff}
  .btn-teal{background:var(--teal);color:#fff}
  .btn-ghost{background:#fff;border:1.5px solid var(--line);color:var(--ink)}

  /* スタート画面：カテゴリー */
  .lead{font-size:13.5px;color:var(--sub);text-align:center;margin-bottom:16px;line-height:1.8}
  .cats{display:grid;grid-template-columns:1fr 1fr;gap:11px}
  .cat-btn{display:flex;flex-direction:column;align-items:center;gap:6px;background:var(--panel);border:1.5px solid var(--line);border-radius:14px;padding:18px 10px;cursor:pointer;font-family:inherit;transition:.12s}
  .cat-btn:hover{border-color:var(--teal)}
  .cat-btn:active{transform:scale(.97)}
  .cat-btn .ic{font-size:30px}
  .cat-btn .nm{font-size:14px;font-weight:800;color:var(--navy)}
  .cat-btn .best{font-size:10.5px;color:var(--sub)}
  .cat-btn.all{grid-column:1 / -1;background:linear-gradient(135deg,var(--flame),#c0561f);border-color:transparent;color:#fff}
  .cat-btn.all .nm{color:#fff}
  .cat-btn.all .best{color:#ffe6da}

  /* 出題画面 */
  .quiz-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
  .quiz-top .prog{font-size:13px;font-weight:800;color:var(--navy)}
  .quiz-top .timer{font-variant-numeric:tabular-nums;font-size:20px;font-weight:900;color:var(--flame);background:#fff;border:1.5px solid var(--line);border-radius:9px;padding:4px 12px}
  .barwrap{height:7px;background:var(--line);border-radius:4px;overflow:hidden;margin-bottom:16px}
  .barwrap span{display:block;height:100%;background:var(--teal);width:0;transition:width .3s}
  .qcat{display:inline-block;font-size:11px;font-weight:800;color:var(--teal);background:#e7f4f2;border-radius:20px;padding:3px 11px;margin-bottom:10px}
  .qtext{font-size:16.5px;font-weight:700;line-height:1.7;color:var(--ink);margin-bottom:16px}
  .opts{display:flex;flex-direction:column;gap:10px}
  .opt{display:flex;align-items:flex-start;gap:11px;background:#fff;border:1.5px solid var(--line);border-radius:11px;padding:13px 14px;cursor:pointer;text-align:left;font-family:inherit;font-size:14.5px;line-height:1.6;transition:.12s}
  .opt:hover{border-color:var(--teal)}
  .opt .lb{flex:none;width:26px;height:26px;border-radius:50%;background:var(--navy);color:#fff;font-weight:800;font-size:14px;display:flex;align-items:center;justify-content:center}
  .opt.correct{border-color:var(--green);background:#eafaf0}
  .opt.correct .lb{background:var(--green)}
  .opt.wrong{border-color:var(--red);background:#fdeeec}
  .opt.wrong .lb{background:var(--red)}
  .opt:disabled{cursor:default}
  .exp{margin-top:14px;background:#f6f9fb;border-left:4px solid var(--teal);border-radius:8px;padding:12px 14px;font-size:13.5px;line-height:1.75;color:#2a3540;display:none}
  .exp.show{display:block}
  .exp .verdict{font-weight:800;margin-bottom:5px}
  .exp .verdict.ok{color:var(--green)}
  .exp .verdict.ng{color:var(--red)}
  .next-wrap{margin-top:14px;display:none}
  .next-wrap.show{display:block}

  /* 結果画面 */
  .result-hero{text-align:center;padding:8px 0 4px}
  .result-hero .big{font-size:40px;font-weight:900;color:var(--navy);font-variant-numeric:tabular-nums}
  .result-hero .big small{font-size:18px;color:var(--sub)}
  .result-hero .time{font-size:22px;font-weight:900;color:var(--flame);font-variant-numeric:tabular-nums;margin-top:2px}
  .result-hero .lbl{font-size:12px;color:var(--sub)}
  .score-line{display:flex;justify-content:center;gap:20px;margin:14px 0}
  .score-line .b{text-align:center}
  .score-line .b .v{font-size:22px;font-weight:900}
  .score-line .b .v.ok{color:var(--green)}
  .score-line .b .v.ng{color:var(--red)}
  .score-line .b .k{font-size:11px;color:var(--sub)}
  .rank-badge{text-align:center;font-size:15px;font-weight:800;margin:6px 0 12px}
  .review{margin-top:8px}
  .review h3{font-size:13px;color:var(--sub);font-weight:800;margin:14px 0 8px}
  .rv{background:#fff;border:1px solid var(--line);border-radius:10px;padding:11px 13px;margin-bottom:8px;font-size:13px}
  .rv .rvq{font-weight:700;margin-bottom:4px}
  .rv .rva{color:var(--green);font-size:12.5px}
  .rv .rvx{color:var(--red);font-size:12.5px}

  /* ランキング */
  .rank-table{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px}
  .rank-table th,.rank-table td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left}
  .rank-table th{color:var(--sub);font-size:11px;font-weight:700}
  .rank-table .rk{font-weight:900;color:var(--navy);width:36px}
  .rank-table .me{background:#fff7 e6}
  .rank-table td.t{font-variant-numeric:tabular-nums;font-weight:800}
  .empty{color:var(--sub);font-size:13px;text-align:center;padding:16px}

  .foot{font-size:11px;color:var(--sub);text-align:center;padding:16px;line-height:1.7}
  .hide{display:none}
  .namein{width:100%;border:1.5px solid var(--line);border-radius:9px;padding:11px;font-size:15px;font-family:inherit;margin:8px 0}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="head-in">
      <img class="head-logo" src="dwa-logo.png" alt="DWA防災情報センター ロゴ">
      <div class="head-txt">
        <div class="en">SPEED &amp; CORRECT TRAINER</div>
        <h1><span class="abbr">SCT</span> ― 状況判断訓練ツール</h1>
        <div class="jp">防災士のための、速く正確な判断力トレーニング</div>
      </div>
    </div>
  </header>
  <main id="main"></main>
  <div class="foot">
    出題は各カテゴリー40問からランダムに10問。選択肢の並びも毎回変わります。<br>
    ※本ツールは訓練用です。実際の災害時は必ず気象庁・自治体等の最新情報に従ってください。
  </div>
</div>

<script>
const DATA = {"cats": {"earthquake": {"name": "地震", "icon": "🏚️", "questions": [{"q": "屋内で強い揺れを感じた。まず取るべき行動は？", "a": ["机の下などに入り頭を守って身を低くする", "慌てて屋外へ走り出して安全な場所へ逃げる", "分電盤のブレーカーを落としに部屋を移動する"], "correct": 0, "exp": "揺れの最中の移動は転倒・落下物で危険。まず身の安全（頭部保護・低い姿勢）を最優先する。"}, {"q": "揺れが収まった直後、屋内で最初に確認すべきことは？", "a": ["エレベーターに乗って一階へ急いで移動する", "自分と家族のけがの有無と避難経路の確保", "倒れた家財を先に片付けて足場を整える"], "correct": 1, "exp": "まず人の安全確認と、ドアを開けるなど避難経路の確保。エレベーターは使わない。"}, {"q": "地震後、ガスのにおいがする。正しい対応は？", "a": ["換気扇のスイッチを入れて室内を換気する", "マッチの火で漏れている箇所を近づいて確認する", "火を使わず窓を開け、元栓を閉めて電気に触れない"], "correct": 2, "exp": "換気扇や電気スイッチの火花が引火の恐れ。火気厳禁で自然換気し元栓を閉める。"}, {"q": "エレベーター乗車中に地震が発生した。最善の行動は？", "a": ["全ての階のボタンを押し最初に止まった階で降りる", "次に止まった階では降りずにそのまま乗り続ける", "停止ボタンを何度も連打して途中で止め続ける"], "correct": 0, "exp": "全階ボタンを押し、最初に停止した階で速やかに降りる。閉じ込め回避の基本。"}, {"q": "就寝中に地震で目覚めた。暗闇で最初にすべきことは？", "a": ["すぐ立ち上がって手探りで出口へ歩き出す", "布団や枕で頭を守り、揺れが収まるのを待つ", "窓を開けて外の様子と揺れの大きさを確認する"], "correct": 1, "exp": "暗所での移動はガラス片等で危険。まず頭部を守り、揺れが収まってから足元を確認して動く。"}, {"q": "海岸沿いで強く長い揺れ。津波警報はまだ出ていない。", "a": ["正確な情報が出るまでその場で待機する", "海面の変化を見て津波の有無を判断する", "警報を待たずにただちに高台へ避難する"], "correct": 2, "exp": "長く強い揺れは津波の可能性。警報を待たず、まず高台へ避難するのが原則。"}, {"q": "自宅が大きく損傷し、余震が続いている。どうする？", "a": ["倒壊の危険があれば避難所へ移動して身を守る", "危険を感じても住み慣れた自宅にとどまる", "車の中での寝泊まりを何日も続けて過ごす"], "correct": 0, "exp": "建物に倒壊・傾斜の危険があれば命を優先し避難所等へ。車中泊長期化はエコノミークラス症候群の危険。"}, {"q": "地震で負傷者が出た。出血が多い。まず行う手当は？", "a": ["患部を心臓より低く下げて保冷剤で冷やす", "清潔な布で傷口を直接強く押さえて止血する", "傷口を大量の水で強くこすって洗い流す"], "correct": 1, "exp": "多量出血はまず直接圧迫止血。患部の挙上も併用。強くこするのは不適切。"}, {"q": "地震後、家族と離れている。安否確認の適切な手段は？", "a": ["相手が出るまで何度も繰り返し電話をかける", "連絡は取らず相手からの着信をひたすら待つ", "災害用伝言ダイヤル171やSNSを活用する"], "correct": 2, "exp": "通話は輻輳しやすい。171やSNS・災害用伝言板など複数手段を活用する。"}, {"q": "避難所へ向かう。持ち出す優先度が高いものは？", "a": ["水・常備薬・貴重品・灯りを入れた非常持ち出し袋", "大型家電と思い出のアルバムをできる限り全部", "冷蔵庫の中の食品を傷まないうちにすべて"], "correct": 0, "exp": "命と健康維持に直結するもの（水・常備薬・情報・灯り・貴重品）を優先。"}, {"q": "ブロック塀のある道を避難中。余震に備えた歩き方は？", "a": ["塀に沿って身を寄せながら素早く通り抜ける", "塀や自動販売機から離れて道の中央寄りを歩く", "塀に片手をついて支えにしながら慎重に進む"], "correct": 1, "exp": "ブロック塀・自販機は転倒の危険。離れて歩くのが安全。"}, {"q": "高層ビル上階で長周期地震動により大きく揺れている。", "a": ["窓際に近づいて外の建物の揺れ具合を確認する", "階段を使って急いで下の階へ降りようとする", "キャスター付きの家具から離れて安全を確保する"], "correct": 2, "exp": "長周期地震動では家具が大きく移動。可動物から離れ、揺れの最中の階段移動は避ける。"}, {"q": "地震直後、停電した。灯りの確保で適切なのは？", "a": ["懐中電灯やLEDライトなど電池式の灯りを使う", "ろうそくに火をつけて部屋を明るく照らす", "ガスコンロの炎で手元や足元を照らして進む"], "correct": 0, "exp": "ガス漏れの可能性がある災害直後は裸火厳禁。懐中電灯等の電池式が安全。"}, {"q": "避難所生活が続く。健康維持で特に注意すべきは？", "a": ["トイレを減らすため水分をなるべく控えて過ごす", "こまめな水分補給と足の運動を意識して続ける", "体力を温存するためできるだけ動かず横になる"], "correct": 1, "exp": "水分制限や不動はエコノミークラス症候群・脱水の危険。適度な水分と運動が重要。"}, {"q": "自宅に戻れることになった。室内へ入る前の確認は？", "a": ["まず電気をつけて室内の被害状況を確認する", "窓を全部閉め切ってから中へ入って点検する", "建物の傾きや亀裂、ガス臭がないか外から確認"], "correct": 2, "exp": "通電火災やガス漏れ・倒壊の危険。まず外観と臭いを確認し、安全を確かめてから。"}, {"q": "本棚が倒れ人が下敷きに。周囲に手伝える人がいる。", "a": ["複数人で安全を確保して救助し必要なら119番", "時間が惜しいので一人で無理に引き出す", "動かすと危ないのでそのまま放置して見守る"], "correct": 0, "exp": "二次被害を防ぎつつ複数人で救助、必要に応じ通報。無理な単独救助は危険。"}, {"q": "通電火災を防ぐため、避難時にすべきことは？", "a": ["照明はつけたままにして帰宅時に備えておく", "分電盤のブレーカーを落としてから家を出る", "コンセントは差したままで速やかに避難する"], "correct": 1, "exp": "停電復旧時の通電火災を防ぐため、避難時はブレーカーを落とす。"}, {"q": "余震が続く中、ガラスが散乱した室内を移動する。", "a": ["音を立てないよう靴下のまま静かに歩く", "足裏の感覚を頼りにはだしで慎重に進んでいく", "底の厚い靴やスリッパを履いて足を守り歩く"], "correct": 2, "exp": "ガラス片でのけがを防ぐため、底の厚い履物が必須。"}, {"q": "調理中でコンロに点火中、強い揺れが襲ってきた。", "a": ["無理に火を消そうとせず、まず身の安全を確保", "火が危ないのですぐ立ち上がり消しに行く", "鍋をつかんで火から離れた場所へ運んで移す"], "correct": 0, "exp": "揺れの最中の火の始末は火傷等の危険。まず身の安全、火は揺れが収まってから消す。"}, {"q": "不確かな情報がSNSで拡散している。防災士の対応は？", "a": ["注意喚起のためすぐ多くの人へ拡散して広める", "公的機関の情報で裏を取ってから行動・発信する", "内容が興味深いのでしばらく反応を見て様子見"], "correct": 1, "exp": "不確かな情報の拡散は混乱を招く。一次情報・公的発表で裏を取る。"}, {"q": "緊急地震速報が鳴った。屋内で数秒後に強い揺れが来る。", "a": ["玄関を目指して勢いよく屋外へ走り出す", "テレビをつけて震源や規模の詳細を確認する", "その場で頭を守り丈夫な机の下に身を寄せる"], "correct": 2, "exp": "猶予は数秒〜数十秒。まず頭部保護と安全な姿勢。移動や情報確認は後。"}, {"q": "運転中に緊急地震速報を受信した。適切な行動は？", "a": ["ハザードを点け緩やかに減速し左に寄せて停止", "後続車を気にせず急ブレーキで即座に停止する", "速度を上げて先の渋滞地点を早めに通り抜ける"], "correct": 0, "exp": "急停止は追突を招く。周囲に知らせ緩やかに減速、左に寄せて停止。"}, {"q": "地震で断水した。トイレの流し方として適切なのは？", "a": ["バケツにためた水を勢いよく一気に流し込む", "排水管の確認まで使わず携帯トイレを利用する", "気にせずいつもどおりレバーで水を流し続ける"], "correct": 1, "exp": "配管破損の恐れがあるため、安全確認まで携帯トイレ等を使う。"}, {"q": "家具の転倒防止対策として最も効果的なのは？", "a": ["家具の上部に重い物を載せて安定させておく", "家具の前に荷物を積んで倒れを受け止める", "L字金具などで家具を壁にしっかり固定する"], "correct": 2, "exp": "壁への固定が最も有効。突っ張り棒は補助的、単独では不十分。"}, {"q": "地震後、断水に備えた生活用水の確保で正しいのは？", "a": ["浴槽に水をためてトイレ等の生活用水に使う", "降った雨水をそのまま容器に集めて飲用にする", "近くの川の水をろ過せずくんで生活に使う"], "correct": 0, "exp": "浴槽の水は生活用水（トイレ等）に有用。飲用は備蓄・給水を用いる。"}, {"q": "避難所で余震が続く。安全な居場所の選び方は？", "a": ["荷物を置きやすい窓際や高い棚のそばを選ぶ", "落下物が少なく出入口を確保できる場所を選ぶ", "冷暖房が効きやすい天井の照明の真下を選ぶ"], "correct": 1, "exp": "落下・転倒物から離れ、避難経路を確保できる位置を選ぶ。"}, {"q": "地震で家族が心肺停止。近くにAEDがある。", "a": ["専門家が到着するまで声をかけて待ち続ける", "口に水を含ませて意識が戻るか様子を見守る", "胸骨圧迫を始めAEDを使い、あわせて119番"], "correct": 2, "exp": "ただちに胸骨圧迫とAED。救命は時間との勝負。"}, {"q": "備蓄品の点検頻度として適切なのは？", "a": ["半年〜1年ごとに消費期限を確認し入れ替える", "場所を取るので数年に一度まとめて見直す", "一度そろえたら中身の確認は特に必要ない"], "correct": 0, "exp": "定期点検と消費・補充の循環（ローリングストック）が有効。"}, {"q": "地震後、ペットと避難する。基本的な考え方は？", "a": ["人優先なのでペットは自宅に残して避難する", "同行避難を原則としキャリーや餌を準備する", "首輪を外して外へ放し自力で逃げさせておく"], "correct": 1, "exp": "同行避難が原則。平時からキャリーや備蓄、しつけの準備を。"}, {"q": "建物の耐震性について正しいのは？", "a": ["建てられた年と地震での安全性に関係はない", "古い建物ほど木材が丈夫で倒れにくい傾向がある", "1981年以降の新耐震基準の建物は耐震性が高い"], "correct": 2, "exp": "1981年の新耐震基準以降は大地震での倒壊リスクが低い。旧基準は要注意。"}, {"q": "地震直後、電池式ラジオが役立つ主な理由は？", "a": ["停電や通信障害の中でも公的な情報を得やすい", "好きな音楽を流して気持ちを落ち着けられる", "電源につながなくても長時間充電が持続する"], "correct": 0, "exp": "停電や通信途絶時でも電池式ラジオで公的情報を得られる。"}, {"q": "避難所でのプライバシー確保に有効なのは？", "a": ["消灯時間を早めて室内をこまめに暗くしておく", "段ボール等の間仕切りで各世帯の空間をつくる", "私語を禁止して静かな環境を全体で維持する"], "correct": 1, "exp": "間仕切りは要配慮者やストレス軽減に有効。運営で重視される。"}, {"q": "地震で液状化が起きやすい土地は？", "a": ["岩盤がしっかりした固い地質の高台の土地", "水はけがよく乾燥した傾斜のある山地の土地", "埋立地や砂地で地下水位が高い平らな場所"], "correct": 2, "exp": "埋立地・砂質・地下水位が高い所で液状化しやすい。ハザードマップで確認。"}, {"q": "余震のたびに強い不安を訴える被災者への対応は？", "a": ["話をよく聴き安心できる情報と環境を整える", "気にしすぎだと伝えて考えないよう促す", "一人で落ち着けるようそっとその場を離れる"], "correct": 0, "exp": "心のケアは重要。傾聴と、正確な情報・安全な環境が安心につながる。"}, {"q": "地震で外にいた。周囲に倒れそうな物が多い。", "a": ["雨風をしのげる建物の軒下に入って揺れを待つ", "建物のガラスや看板から離れ頭を守り身を低く", "倒れないよう近くの電柱につかまって体を支える"], "correct": 1, "exp": "落下・倒壊物から離れ、かばん等で頭を守る。軒下・電柱は危険。"}, {"q": "家庭で備える飲料水の量の目安は？", "a": ["1人1リットルもあれば当面はしのげて十分", "給水車が来るので家庭での備蓄は特に不要", "1人1日3リットルを最低でも3日分そろえる"], "correct": 2, "exp": "飲料・調理用に1人1日3L、最低3日（できれば7日）分が目安。"}, {"q": "地震後、自宅のブロック塀に亀裂を見つけた。", "a": ["余震で倒れる危険があり近づかず注意を促す", "見た目は変わらないのでそのままにしておく", "強度を確かめるため寄りかかって揺すってみる"], "correct": 0, "exp": "損傷した塀は余震で倒壊の恐れ。近づかず周囲にも注意を促す。"}, {"q": "避難生活での感染症予防で重要なのは？", "a": ["貴重な水を節約するため手洗いは最小限にする", "手洗い・うがい・換気・マスクを徹底して行う", "暖を取るため人となるべく密集して身を寄せる"], "correct": 1, "exp": "集団生活では感染が広がりやすい。基本的な衛生対策が要。"}, {"q": "地震で閉じ込められ、身動きは取れるが声が届かない。", "a": ["助けを呼ぶため大声を出し続けて存在を伝える", "体力を使わないよう何もせず救助をただ待つ", "笛やたたく音を使い断続的に居場所を知らせる"], "correct": 2, "exp": "体力温存が重要。笛や打音で効率よく存在を知らせる。防災笛が有効。"}, {"q": "防災訓練『DIG（災害図上訓練）』の目的は？", "a": ["地図上で地域の危険と資源を把握し対策を練る", "参加者で協力して避難所の清掃と設営を行う", "来場者に防災用品を紹介して普及や販売を図る"], "correct": 0, "exp": "DIGは地図上で地域の危険箇所・避難経路・資源を共有し備える訓練。"}]}, "fire": {"name": "火災", "icon": "🔥", "questions": [{"q": "室内で火災発生。炎はまだ小さい。最初の行動は？", "a": ["大声で周囲に知らせてから初期消火を試みる", "状況を記録するため落ち着いて写真を撮る", "新鮮な空気を入れるため窓を大きく開ける"], "correct": 0, "exp": "まず周囲への通報（大声・警報）。初期消火は炎が天井に達する前まで。窓を開けると酸素供給で拡大。"}, {"q": "天ぷら油から出火した。正しい消火方法は？", "a": ["炎を鎮めるため上から勢いよく水をかける", "火を止め、消火器やふたで空気を遮断して消す", "うちわであおいで炎を吹き飛ばして消し止める"], "correct": 1, "exp": "油に水は爆発的に燃え広がり危険。空気遮断（ふた・消火器）が正しい。"}, {"q": "火災で煙が充満し始めた。避難時の姿勢は？", "a": ["視界を確保するため立って早足で通り抜ける", "煙を吸わないよう息を止めて一気に走り抜ける", "姿勢を低くし口鼻を布で覆いながら進んで逃げる"], "correct": 2, "exp": "煙は上にたまる。低い姿勢で新鮮な空気を吸いつつ、口鼻を布で覆って避難。"}, {"q": "避難経路のドアが熱い。向こうが火災の可能性。", "a": ["開けずに別の避難経路を探して安全に逃げる", "時間が惜しいのですぐ開けてそこを通り抜ける", "少しずつ開けて向こうの様子を慎重に確認する"], "correct": 0, "exp": "熱いドアの先は火勢が強い危険。開けると急激な延焼（バックドラフト）の恐れ。別経路へ。"}, {"q": "消火器を使う。正しい操作の順序は？", "a": ["ホースを火元へ向けてから安全ピンを抜き握る", "安全ピンを抜き、ホースを火元に向け、レバーを握る", "先にレバーを握ってから火に近づいて放射する"], "correct": 1, "exp": "ピンを抜く→ホースを火元へ→レバーを握る、が基本手順。手前から掃くように放射。"}, {"q": "初期消火をあきらめて避難すべき目安は？", "a": ["周囲の家具に火が燃え移るまでは消火を続ける", "煙が出始めたら最後まで消し切る覚悟で臨む", "炎が天井に達したら消火をやめて退避する"], "correct": 2, "exp": "炎が天井に届いたら消火は困難。ただちに避難し119番。無理は禁物。"}, {"q": "自分の衣服に火がついた。正しい対処は？", "a": ["立ち止まって倒れ、地面を転がって火を消す", "風で火を消すため広い場所へ走って移動する", "水を求めて洗面所や台所へ急いで走って行く"], "correct": 0, "exp": "走ると火が大きくなる。止まって倒れ、転がって火を消すのが国際的な基本。"}, {"q": "高層階で火災報知器が鳴った。廊下に煙は見えない。", "a": ["混雑を避けてエレベーターで下の階へ降りる", "状況を確かめつつ階段での避難準備を進める", "しばらく窓の外を眺めて火元の場所を探す"], "correct": 1, "exp": "火災時エレベーターは使わない。階段避難を基本に、煙の有無で判断。"}, {"q": "いったん避難した後にすべきことは？", "a": ["大事な忘れ物を取りに建物へ急いで戻る", "消火の進み具合を建物の近くで見守る", "戻らず全員の安否を確認し119番と点呼"], "correct": 2, "exp": "一度避難したら戻らない。安否確認と通報を優先。"}, {"q": "住宅用火災警報器の適切な設置・管理は？", "a": ["寝室や階段など就寝環境を中心に設置し点検する", "火を使う台所にだけ取り付けておけば十分である", "一度設置すれば電池切れの点検は特に必要ない"], "correct": 0, "exp": "就寝中の逃げ遅れ防止のため寝室・階段等に設置。電池切れ確認など定期点検が必要。"}, {"q": "逃げ遅れて部屋に閉じ込められ、煙が入ってくる。", "a": ["勢いをつけてドアを開け煙の中を突破して逃げる", "ドアの隙間を濡れタオルでふさぎ窓で助けを呼ぶ", "身を隠すため押し入れの奥に入って様子を見る"], "correct": 1, "exp": "煙の侵入を防ぎつつ、窓等で救助を求め居場所を知らせる。"}, {"q": "電気機器から出火した。最初にすべきことは？", "a": ["炎を鎮めるためすぐに上から水をかけて消す", "機器を屋外へ運び出して被害の拡大を防ぐ", "可能なら電源を切りコンセントを抜く、危険なら避難"], "correct": 2, "exp": "感電の危険で水は不可。まず電源遮断。危険なら避難優先。"}, {"q": "避難訓練で防災士が参加者に最も伝えるべきことは？", "a": ["消火よりも避難経路の確認と初期判断を身につける", "主要な消火器の種類と本体の色の違いを覚える", "過去の火災による死者数などの統計を暗記する"], "correct": 0, "exp": "命を守る行動（早期避難と適切な初期判断）の習得が最重要。"}, {"q": "就寝中に警報器が鳴り、煙のにおいがする。最優先は？", "a": ["原因を突き止めるため落ち着いて詳しく調べる", "家族全員をすぐ起こしてただちに避難を始める", "貴重品や通帳をまとめてから落ち着いて逃げる"], "correct": 1, "exp": "夜間火災は逃げ遅れが致命的。まず全員避難。"}, {"q": "調理中の着衣着火を防ぐための基本は？", "a": ["短時間で済ませるため火力を最大にして手早く", "動きやすいよう袖はまくらずそのまま作業する", "火のそばを離れず防炎エプロン等を身につける"], "correct": 2, "exp": "着衣着火の多くは調理中。火から目を離さず、防炎品の活用が有効。"}, {"q": "避難所で使う暖房器具の火災予防で重要なのは？", "a": ["可燃物を近づけず就寝時や離席時は必ず消す", "暖かさを保つため一日中つけっぱなしにする", "手間を省くため使用したまま燃料を給油する"], "correct": 0, "exp": "暖房器具火災の基本予防。可燃物の距離確保、就寝・不在時消火、給油は消火後。"}, {"q": "屋内消火栓を使う際、防災士として適切なのは？", "a": ["時間を惜しんで一人で操作し放水を開始する", "複数人で連携し放水役と操作役を分担して行う", "水圧を確かめず先にノズルを開いて放水する"], "correct": 1, "exp": "屋内消火栓は複数人での連携操作が基本。反動が大きく単独は危険。"}, {"q": "火災報知器が誤作動と思われる。適切な対応は？", "a": ["わずらわしいのですぐ止めてそのまま無視する", "電池を抜いて音を止め原因の確認は後回しにする", "誤作動と決めつけず、まず火災の有無を確認する"], "correct": 2, "exp": "誤作動と決めつけるのは危険。必ず現場確認してから判断。"}, {"q": "避難時、エレベーターを使ってはいけない主な理由は？", "a": ["停電で扉が開かず中に閉じ込められる恐れがある", "利用者が集中して混雑し移動に時間がかかるため", "操作が複雑で高齢者には扱いにくい設備だから"], "correct": 0, "exp": "火災時は停電・煙の流入・閉じ込めの危険があり、階段避難が原則。"}, {"q": "林野火災（山火事）を発見した。防災士の初動は？", "a": ["延焼前に自分で水や土をかけて消火を試みる", "安全を確保し、位置情報を添えて速やかに119番", "炎の広がり方を確かめるため風下から近づく"], "correct": 1, "exp": "山火事は延焼が速い。無理な消火や風下接近は危険。正確な通報が最優先。"}, {"q": "住宅火災で死亡原因として最も多いのは何か？", "a": ["高温の炎に触れることで生じる全身のやけど", "建物の柱や梁が焼け落ちて起こる圧迫や倒壊", "煙や有毒ガスを吸い込むことによる中毒や窒息"], "correct": 2, "exp": "火災死の多くは煙・有毒ガス。早期発見と煙を避ける避難が命を守る。"}, {"q": "火災警報器の電池が切れたときの対応は？", "a": ["速やかに電池を交換するか本体ごと交換する", "特に危険はないのでそのまま放置しておく", "誤作動を防ぐため配線や電池を抜いておく"], "correct": 0, "exp": "警報器は電池切れで機能しない。定期点検と交換が必須。"}, {"q": "コンセント周りのトラッキング火災を防ぐには？", "a": ["複数の延長コードを束ねてまとめて配線する", "差し込み部のほこりを掃除し不要な機器は抜く", "一つの口にたこ足配線を増やして効率よく使う"], "correct": 1, "exp": "ほこりと湿気が原因のトラッキング火災。清掃と不要機器の抜き取りが有効。"}, {"q": "寝たばこが特に危険とされる理由は？", "a": ["消した後の灰が周囲を汚して掃除が大変なため", "煙のにおいが寝具や部屋に長く残ってしまうため", "眠り込んで寝具に着火し気づかず延焼するため"], "correct": 2, "exp": "寝たばこは就寝中の着火・逃げ遅れで死亡率が高い。厳禁。"}, {"q": "消火器の交換時期の目安として正しいのは？", "a": ["おおむね製造から10年程度を目安に交換する", "丈夫なので買い替えず半永久的に使い続ける", "安全のため毎年新しいものに買い替えて備える"], "correct": 0, "exp": "消火器は経年劣化する。目安10年で点検・交換。破裂事故の例もある。"}, {"q": "カーテンに火が燃え移りそう。手元に水がある。", "a": ["火の勢いを止めるためカーテンを引きちぎる", "水をかけて消し、広がるなら避難して通報する", "空気を入れ替えるため近くの窓を大きく開ける"], "correct": 1, "exp": "初期なら水で消火。手に負えなければ避難と通報を優先。"}, {"q": "防炎製品（カーテン・寝具等）の主な利点は？", "a": ["汚れがつきにくく手入れが簡単で長く使える", "一般製品より安価で家計の負担を抑えられる", "燃えにくく延焼を遅らせて避難の時間を稼げる"], "correct": 2, "exp": "防炎品は着火・延焼を遅らせ、避難の時間を稼ぐ。高層住宅では推奨。"}, {"q": "石油ストーブの給油はいつ行うべきか？", "a": ["必ず火を消してから安全を確かめて給油する", "時間短縮のため使用中に手早く給油を済ませる", "つけたまま窓を開けて換気しながら給油する"], "correct": 0, "exp": "使用中の給油はこぼれた燃料に引火し危険。必ず消火後に。"}, {"q": "避難はしごなど避難器具の平時の備えは？", "a": ["必要になったそのときに調べて使い方を覚える", "設置場所と使い方を家族で事前に確認しておく", "邪魔にならないよう飾りとして置いておくだけ"], "correct": 1, "exp": "いざというとき使えるよう、位置と操作を平時に確認・訓練する。"}, {"q": "油火災（B火災）に使える消火器はどれか？", "a": ["種類を問わずどの消火器でも同じように使える", "水を放射して炎を冷やす水消火器が最も有効", "ABC粉末消火器など油火災に対応した消火器"], "correct": 2, "exp": "油はB火災。ABC粉末等の対応消火器を使う。水消火器は不可。"}, {"q": "火災で煙が廊下に充満し、自室から出られない。", "a": ["ドアを閉め隙間をふさぎ窓から助けを求める", "勢いをつけてドアを開け廊下を突破して逃げる", "エアコンをつけて室内の空気を循環させて待つ"], "correct": 0, "exp": "煙の侵入を防ぎ、窓から存在を知らせる。無理な突破は禁物。"}, {"q": "たき火・野焼き中に火が広がりそう。防災士の初動は？", "a": ["燃え方を確認するため風下側から近づいて見る", "風上側から水や土をかけ、危険なら119番通報", "自然に鎮まるのを待ちしばらく様子を見守る"], "correct": 1, "exp": "延焼前に消火。危険なら通報。風下接近は巻き込まれる恐れ。"}, {"q": "高齢者世帯の火災予防として有効なのは？", "a": ["長年使い慣れた古い燃焼器具をそのまま使い続ける", "手間なので火の元の確認は習慣にせず省略する", "立ち消え検知やIHなど安全機能のある機器を使う"], "correct": 2, "exp": "立ち消え検知や消し忘れ防止機能のある機器が有効。声かけも大切。"}, {"q": "火災の119番通報で最初に伝えるべきことは？", "a": ["火事であることと住所・目標物など正確な場所", "まず自分の氏名と連絡先を落ち着いて伝える", "炎の色や煙の量など燃え方の詳しい状況"], "correct": 0, "exp": "『火事です』と正確な場所を最優先で伝える。落ち着いて要点から。"}, {"q": "スプレー缶・カセットボンベの火災予防は？", "a": ["中身を乾かすため日光のよく当たる場所に置く", "車内やコンロ近くなど高温になる場所に置かない", "よく振って中身を出し切ってから捨てるとよい"], "correct": 1, "exp": "高温で破裂・引火の危険。直射日光や火気の近くを避けて保管・廃棄。"}, {"q": "煙で視界が悪い中、壁伝いに進むのがよい理由は？", "a": ["壁際は温度が低く煙も薄いので呼吸が楽なため", "壁に沿うと足場が安定して速く走り抜けられる", "方向を見失わず確実に出口へたどり着けるため"], "correct": 2, "exp": "視界不良でも壁伝いなら経路を保てる。低い姿勢と併用する。"}, {"q": "共同住宅の防火戸を普段ふさいではいけない理由は？", "a": ["火と煙の拡大を食い止める役割を持つ設備だから", "廊下の見た目や通行のじゃまになってしまうから", "法律で禁止されているという理由があるだけだから"], "correct": 0, "exp": "防火戸は火と煙の拡大を食い止める。物でふさぐと機能しない。"}, {"q": "初期消火に失敗しそうなとき、最優先すべきは？", "a": ["火が小さくなるまで粘り強く消火を続ける", "自分と周囲の命を守り避難と通報を優先する", "燃えると困る貴重品を先に運び出しておく"], "correct": 1, "exp": "消火より命。危険を感じたら退避と通報を最優先。"}, {"q": "家庭の火災への備えとして大切なことは？", "a": ["家の造りに詳しい一人だけが対応を把握しておく", "起きてから考えればよいので特に準備はしない", "家族で避難経路と集合場所を決めて共有しておく"], "correct": 2, "exp": "家族全員で経路・集合場所・連絡方法を共有しておくことが重要。"}, {"q": "感震ブレーカーの主な役割は何か？", "a": ["地震の揺れを感知し自動で電気を遮断して火災を防ぐ", "地震の発生を事前に察知して住人に危険を知らせる", "停電が起きないよう電気の供給を安定して保ち続ける"], "correct": 0, "exp": "揺れを感知し電気を遮断、地震後の通電火災を防ぐ有効な対策。"}]}, "tsunami": {"name": "津波", "icon": "🌊", "questions": [{"q": "海辺で強い揺れを感じた。津波警報はまだ出ていない。", "a": ["警報を待たずにただちに高台へ避難を始める", "正確な警報の内容を確認してから行動を決める", "海面が変化しないか浜辺で様子を見て判断する"], "correct": 0, "exp": "津波は警報より速いことがある。強い揺れ＝即高台避難が鉄則。"}, {"q": "津波避難で最も適切な避難の方向は？", "a": ["海岸線と平行に走って隣の地区へと移動する", "より高くより遠くの安全な場所を目指して逃げる", "距離が近い低い場所への抜け道を通って逃げる"], "correct": 1, "exp": "『より高く・より遠く』が原則。標高の高い場所を目指す。"}, {"q": "津波避難の移動手段として原則とされるのは？", "a": ["渋滞を避けるため自動車で一気に遠くへ逃げる", "小回りのきく自転車で海沿いの道を走って逃げる", "原則として徒歩で近くの高台へ向かって逃げる"], "correct": 2, "exp": "渋滞・立ち往生の危険があるため原則徒歩。ただし地域事情で例外もある。"}, {"q": "津波の第一波が引いた後にとるべき行動は？", "a": ["警報が解除されるまで高台にとどまり続ける", "被害を確認するためすぐに自宅へ戻って点検する", "引いた海の様子を見に浜辺へ近づいて確認する"], "correct": 0, "exp": "津波は繰り返し襲来し、後の波が大きいこともある。解除まで戻らない。"}, {"q": "避難中、渋滞で車が動かない。津波が迫る可能性。", "a": ["安全のため車内にとどまって渋滞の解消を待つ", "車を安全な場所に置き、徒歩で高台へ移動する", "来た道を引き返して別のルートへ迂回して逃げる"], "correct": 1, "exp": "車を捨ててでも徒歩で高台へ。命を最優先。"}, {"q": "海面が突然引いて海底が見えた。これは何を示す？", "a": ["潮の満ち引きによる自然な干潮で心配はいらない", "魚が獲りやすくなる絶好の機会を示すサイン", "津波が来る前触れの可能性があり危険なサイン"], "correct": 2, "exp": "急な引き波は津波の前兆。ただちに避難する。"}, {"q": "津波避難ビルの選び方として適切なのは？", "a": ["鉄筋コンクリート造で十分な高さのある建物の上階", "柱の見える木造平屋で出入りのしやすい建物", "地下があり物資を保管できる頑丈そうな建物"], "correct": 0, "exp": "頑丈で十分な高さのある建物の上階へ。木造・地下は不適。"}, {"q": "大津波警報に切り替わった。低い高台に避難済み。", "a": ["すでに避難したので今の場所にとどまり続ける", "可能な限りさらに高い場所へと移動して逃げる", "海の方向を確認して津波の到達具合を見極める"], "correct": 1, "exp": "大津波警報は非常に高い津波の恐れ。可能な限りさらに高所へ。"}, {"q": "高齢者と一緒に避難する。防災士として適切なのは？", "a": ["間に合わせるため自分だけ先に高台へ避難する", "確実に運ぶため必ず車に乗せて送り届ける", "早めに避難を始め経路も確認して共に逃げる"], "correct": 2, "exp": "要配慮者は避難に時間がかかる。早期開始と事前準備が鍵。"}, {"q": "川の近くにいるときに津波警報が出た。どうする？", "a": ["津波が遡上する恐れがあり川から離れ高台へ", "川は海と別なので気にせずその場にとどまる", "流れに沿って川沿いを下流方向へ歩いて逃げる"], "correct": 0, "exp": "津波は河川を遡上する。川から離れて高台へ。"}, {"q": "『津波てんでんこ』の教えが意味するのは？", "a": ["家族が全員そろってからまとめて逃げること", "各自がためらわず即座に高台へ逃げること", "はぐれた家族を捜し出してから一緒に逃げること"], "correct": 1, "exp": "『津波てんでんこ』は各自が即避難する教え。結果的に多くの命を守る。"}, {"q": "『津波避難場所』と『津波避難ビル』の違いは？", "a": ["どちらも同じ意味で呼び方が違うだけである", "避難ビルは避難場所より安全性が低い施設である", "避難場所は高台、避難ビルは緊急一時退避の建物"], "correct": 2, "exp": "避難場所は高台等、避難ビルは近くに高台がない場合の緊急退避先。"}, {"q": "揺れは弱かったが遠地地震の津波情報が出た。", "a": ["発表された情報に従って高台へ避難する", "揺れが小さかったので特に気にせず過ごす", "念のため数時間ほど様子を見てから考える"], "correct": 0, "exp": "遠地津波は揺れが小さくても到達する。情報に従い避難。"}, {"q": "避難後、家族の安否が分からない。とるべき行動は？", "a": ["家族を捜すため海側の自宅方向へ戻っていく", "安全な場所で災害用伝言板などを使い確認する", "警報が解除される前に一度自宅へ様子を見に戻る"], "correct": 1, "exp": "戻るのは厳禁。安全確保のうえ伝言板等で確認。"}, {"q": "津波の高さ『1m』の予報。人への危険度は？", "a": ["高さが低いので特に危険はなく問題はない", "膝下ほどの深さなので歩いて移動できて安全", "1mでも人は簡単に流されてしまい危険である"], "correct": 2, "exp": "わずか数十cmでも人は流される。1mは十分致命的。"}, {"q": "夜間に津波警報。停電で暗い。避難で重要なのは？", "a": ["懐中電灯を確保し決めた経路で速やかに逃げる", "足元が見えるよう明るくなるまで待って動く", "車のライトで海を照らして津波の接近を見張る"], "correct": 0, "exp": "夜間でも即避難。灯りの確保と、日頃の経路確認が生死を分ける。"}, {"q": "観光地で被災し土地勘がない。津波警報が出た。", "a": ["混乱を避けるため人の流れと逆の方向へ進む", "スマホで最寄りの高台や避難ビルを調べて逃げる", "慣れた場所である海沿いのホテルへ戻って待つ"], "correct": 1, "exp": "避難情報アプリや標識で高台・避難ビルを確認。周囲の避難行動も参考に。"}, {"q": "防災士として住民に津波避難で最も強調すべきは？", "a": ["専門知識を使って津波の正確な高さを予測すること", "持ち出す非常用品を漏れなく完璧にそろえておくこと", "警報を待たず、揺れたら即・高く・遠くへ逃げる習慣"], "correct": 2, "exp": "即時避難の習慣化が最重要。準備より命を守る初動。"}, {"q": "津波注意報のみ発表。海岸で作業していた。", "a": ["海から上がって海岸や河口から離れて避難する", "注意報にすぎないので作業をそのまま続ける", "海の様子を確かめながら作業を続けて判断する"], "correct": 0, "exp": "注意報でも海の中・海岸は危険。速やかに離れる。"}, {"q": "高潮と津波の違いとして正しいのは？", "a": ["どちらも同じ現象で呼び名が異なるだけである", "津波は地震等、高潮は台風の気圧・風による海面上昇", "高潮のほうが津波よりも到達がずっと速い現象"], "correct": 1, "exp": "津波は海底地形変動、高潮は低気圧・強風による海面上昇。成因が異なる。"}, {"q": "津波警報が解除された。自宅は浸水した。戻る前の注意は？", "a": ["片付けを急ぐためすぐ中に入って作業を始める", "足を洗いやすいよう裸足で家の中へ入っていく", "感電やガス漏れ・汚水に注意し安全確認後に入る"], "correct": 2, "exp": "浸水家屋は感電・ガス・衛生の危険。安全確認と装備（手袋・長靴等）が必要。"}, {"q": "津波避難タワーの役割として正しいのは？", "a": ["近くに高台がない地域で緊急に高所へ逃げる施設", "景色を楽しむために設けられた観光用の展望施設", "非常用の食料や毛布などをためておく保管倉庫"], "correct": 0, "exp": "高台のない沿岸で命を守る緊急避難施設。位置を平時に確認。"}, {"q": "津波の速度について正しいのは？", "a": ["どんな場所でも人の歩く速さより遅くて安全", "沖では非常に速く走って逃げ切れないことがある", "水深に関係なくどこでも一定の速度で進んでくる"], "correct": 1, "exp": "沖ではジェット機並み、陸に近づくと減速するが人の足より速い場合も。早期避難が鍵。"}, {"q": "船に乗っていて津波警報。港の近くにいる。", "a": ["安全そうな港に戻って船をしっかり係留する", "そのまま港に停泊して警報の解除を待ち続ける", "時間があれば沖の深い海域へ避難する（沖出し）"], "correct": 2, "exp": "津波は水深が浅いほど高くなる。時間があれば沖出しが有効（状況による）。"}, {"q": "避難後、SNSで『津波は来ない』という未確認情報。", "a": ["公的機関の発表を確認し解除まで戻らない", "情報を信じて安心し自宅へ引き返していく", "有益な情報として多くの人へ拡散して伝える"], "correct": 0, "exp": "未確認情報で戻るのは危険。公的な解除を待つ。"}, {"q": "高台までの避難経路を複数知っておく理由は？", "a": ["日ごろの散歩コースとして楽しんで歩けるため", "一つの道が通れなくても別の道で避難できるため", "どの道が一番速いか到達時間を競い合うため"], "correct": 1, "exp": "倒壊・渋滞・冠水で経路が塞がることがある。代替路の把握が命を守る。"}, {"q": "車避難がやむを得ない地域での注意点は？", "a": ["ぎりぎりまで自宅で待ってから一気に車で逃げる", "車内の安全を保つため窓を閉め切って走行する", "渋滞や立ち往生の危険を理解して早めに動き出す"], "correct": 2, "exp": "車避難は原則徒歩の例外。使う場合は早期出発が絶対条件。"}, {"q": "津波の第一波が最大とは限らない理由は？", "a": ["後続の波が重なってより大きくなることがあるため", "毎回同じ高さの波が規則正しく打ち寄せるため", "満ち引きの影響で二波目以降は必ず小さくなるため"], "correct": 0, "exp": "波は繰り返し、後の波が大きいことも。解除まで戻らない。"}, {"q": "沿岸の要配慮者施設の津波避難計画で重要なのは？", "a": ["混乱を避けるため災害が起きた当日に方針を決める", "上階への垂直避難先の確保と早期避難の手順化", "避難の判断や誘導をすべて現場の職員に任せておく"], "correct": 1, "exp": "避難に時間を要するため、上階等への垂直避難と早期開始を手順化する。"}, {"q": "津波避難訓練で防災士が確認すべきことは？", "a": ["訓練に参加した住民のおおよその人数だけ", "当日の天気が訓練に適しているかどうか", "避難完了までの所要時間と避難経路の安全性"], "correct": 2, "exp": "実際に避難して所要時間・危険箇所を把握し改善する。"}, {"q": "『津波フラッグ』とは何を伝えるものか？", "a": ["海水浴場などで津波警報を視覚的に伝える赤白の旗", "その日の海開きの開始を知らせる合図としての旗", "風の向きや強さを浜辺の利用者に示すための旗"], "correct": 0, "exp": "聴覚に頼れない人にも伝わる視覚的な警報。見たら即避難。"}, {"q": "避難所が沿岸の低地にしかない。津波警報が出た。", "a": ["近いのでその低地の避難所へ向かって逃げる", "より高い場所か津波避難ビルへ移動して逃げる", "海の様子を確認しながら避難の要否を判断する"], "correct": 1, "exp": "津波時は浸水想定外の高所が最優先。低地の避難所は不適な場合がある。"}, {"q": "津波で流された人を発見。自分は高台にいる。", "a": ["助けるため急いで海のほうへ下りて向かう", "巻き込まれないよう見ないふりをして立ち去る", "浮くものを投げて渡し、救助を要請して待つ"], "correct": 2, "exp": "二次被害を防ぐため自ら飛び込まない。浮具の提供と通報・救助要請。"}, {"q": "揺れは小さかったが海外で巨大地震。日本への影響は？", "a": ["遠地津波が海を越えて到達する恐れがある", "距離が遠いので日本沿岸には全く影響しない", "数日ほど遅れてから緩やかに波が到達する"], "correct": 0, "exp": "遠地地震でも津波は太平洋を越えて到達する。情報に従い備える。"}, {"q": "津波ハザードマップで平時に確認すべきことは？", "a": ["近隣にある駐車場のおおよその位置や台数", "浸水が想定される範囲や深さと避難場所・経路", "近くの飲食店や商業施設のあるおおまかな場所"], "correct": 1, "exp": "自宅・職場の浸水リスクと、逃げる先・道を平時に把握しておく。"}, {"q": "避難中、幼児を連れている。最も適切なのは？", "a": ["幼児と手をつなぎ歩幅を合わせてゆっくり歩く", "確実に運ぶため車に乗せて海沿いの道を走る", "抱っこやおんぶで両手を空け素早く高台へ逃げる"], "correct": 2, "exp": "幼児は歩行が遅い。抱えて機動力を確保し、より高くより遠くへ。"}, {"q": "津波警報中、防潮堤の上は安全といえるか？", "a": ["越波や決壊の危険があり堤防の上や近くは避ける", "高さがあり安全なので堤防の上へ登って避難する", "津波を観察するのに最も適した安全な場所である"], "correct": 0, "exp": "防潮堤は万能でない。越波・決壊の恐れがあり、堤上・堤近くは危険。"}, {"q": "沿岸の職場で被災。従業員の津波避難で重要なのは？", "a": ["全員の点呼を取って人数を確認してから避難する", "各自がただちに高台へ逃げる原則を全員で徹底する", "責任者である上司の避難指示が出るのを待って動く"], "correct": 1, "exp": "点呼待ちは逃げ遅れる。各自即避難を原則とし、後で安否確認。"}, {"q": "津波注意報・警報・大津波警報の違いは？", "a": ["呼び方が違うだけでいずれも同じ意味を持つ", "注意報が最も危険度の高い最上位の発表である", "予想される高さと危険度が段階的に異なっている"], "correct": 2, "exp": "注意報＜警報＜大津波警報の順に危険度が上がる。いずれも海から離れる。"}, {"q": "避難生活が長期化。沿岸被災地の防災士の役割は？", "a": ["安否確認や情報整理、要配慮者支援などの後方支援", "重機を使った建物の解体や復旧作業を一人で担う", "特に役割はないので落ち着くまで静かに待機する"], "correct": 0, "exp": "共助の要として情報・支援の調整、要配慮者の見守り等を担う。"}]}, "landslide": {"name": "土砂災害", "icon": "⛰️", "questions": [{"q": "大雨が続き、山の斜面から小石が落ちてきた。これは？", "a": ["がけ崩れの前兆の可能性があり危険なサイン", "雨で流れ落ちた自然な現象で心配はいらない", "まもなく雨がやむことを知らせる合図である"], "correct": 0, "exp": "小石の落下は崩壊の前兆。ただちに斜面から離れ避難する。"}, {"q": "斜面から急に水が湧き出し濁ってきた。適切な行動は？", "a": ["珍しい現象なので湧き水をしばらく観察し続ける", "土砂災害の前兆とみてただちに避難を開始する", "水質を確かめるためくみ取って詳しく調べる"], "correct": 1, "exp": "濁り水・湧水の増加は崩壊の前兆。避難を判断する。"}, {"q": "『土砂災害警戒情報』が出た。警戒区域に住んでいる。", "a": ["雨脚が弱まるまで自宅で待機して様子を見る", "窓から斜面の様子を見張り崩れる前兆を探す", "命に危険が迫るサインなので速やかに避難する"], "correct": 2, "exp": "警戒情報は命に危険が迫るサイン。区域内は速やかに避難。"}, {"q": "避難が遅れ外が危険で動けない。がけの近くの家。", "a": ["がけと反対側の2階以上の部屋へ移動する", "1階のがけ側の部屋で身を伏せてやり過ごす", "危険を感じたら思い切って外へ飛び出す"], "correct": 0, "exp": "垂直避難。がけから離れた高い部屋へ移り、少しでも安全性を高める。"}, {"q": "土砂災害の前兆として正しくないものは？", "a": ["山の方から山鳴りや地鳴りが聞こえてくる", "雨雲が去って空が急にからりと晴れ渡る", "立っている木が裂けるような音が鳴り響く"], "correct": 1, "exp": "山鳴り、亀裂、湧水の変化、木の裂ける音などが前兆。晴天は前兆ではない。"}, {"q": "川がふだんより濁り流木が流れてきた。上流で何が？", "a": ["雨で川底がかき混ぜられ水質が良くなっている", "魚が増えて漁がしやすくなる状況が起きている", "上流で土砂崩れや土石流が発生した可能性がある"], "correct": 2, "exp": "急な濁りと流木は上流の崩壊・土石流の兆候。川から離れる。"}, {"q": "土石流の避難方向として最も適切なのは？", "a": ["流れに対して直角の方向にある高い場所へ逃げる", "流れと同じ方向の下流側へ向かって走って逃げる", "様子を見るため川沿いを上流方向へ進んでいく"], "correct": 0, "exp": "土石流は速い。流れに対して直角に、かつ高い場所へ逃げる。"}, {"q": "夜間に大雨。警戒区域だが避難情報は高齢者等避難。", "a": ["自分は高齢ではないので情報が上がるまで待つ", "夜間の移動を避け明るいうちに早めに避難する", "警戒レベルがさらに上がってから避難を始める"], "correct": 1, "exp": "夜間・豪雨時の移動は危険。早めの自主避難が命を守る。"}, {"q": "避難所へ向かう途中、道路が冠水し流れが速い。", "a": ["時間が惜しいので流れの中を無理に渡っていく", "車に乗り換えて一気に冠水路を突破していく", "引き返してより安全な高い建物へ避難する"], "correct": 2, "exp": "冠水路の横断は危険。無理せず垂直避難など代替手段へ。"}, {"q": "警戒区域のイエローとレッドの違いは？", "a": ["レッドは建物損壊の恐れがある特に危険な区域", "呼び方が違うだけでどちらも同じ意味である", "イエローのほうがレッドより危険度が高い区域"], "correct": 0, "exp": "レッド（特別警戒区域）は建築規制もある特に危険な区域。"}, {"q": "地震の後に大雨。土砂災害の危険はどうなるか？", "a": ["地震と土砂災害は無関係で危険は変わらない", "地盤が緩んでおり少ない雨でも崩れやすくなる", "地盤が締まってむしろ崩れにくく安全になる"], "correct": 1, "exp": "地震で緩んだ斜面は少ない雨でも崩れやすい。警戒を強める。"}, {"q": "防災士として住民に伝える避難のタイミングは？", "a": ["実際に被害が出始めてから確実に避難を開始する", "近所の人が避難を始めるのを見てから自分も動く", "前兆や警戒情報が出たら空振りを恐れず早めに逃げる"], "correct": 2, "exp": "早すぎるくらいでちょうどよい。空振り上等の姿勢が命を守る。"}, {"q": "擁壁やがけに新しい亀裂やはらみ出しを見つけた。", "a": ["崩壊の兆候として警戒し避難を検討して通報する", "急ぐ必要はないのでしばらく様子を見て過ごす", "強度を確かめるため自分で簡単に補修してみる"], "correct": 0, "exp": "亀裂・はらみは崩壊の前兆。近づかず避難と関係機関への連絡。"}, {"q": "ハザードマップで自宅が土砂災害の危険区域内だった。", "a": ["特に気にせずこれまでどおりの生活を続けていく", "避難場所と経路を家族で確認し日ごろから備える", "雨が降っている日にだけ避難について考えておく"], "correct": 1, "exp": "平時の確認・訓練が有事の行動を決める。"}, {"q": "避難中、斜面側と谷側のどちらを歩くのが比較的安全？", "a": ["崩れにくいと考えて斜面のある山側に寄って歩く", "見晴らしのよい谷側の縁に沿って歩いて進む", "崩落の来る斜面から離れた側を選んで歩く"], "correct": 2, "exp": "崩落は斜面側から来る。可能な限り斜面から離れた側を選ぶ。"}, {"q": "土砂災害の前兆を発見。近隣にも危険が及ぶ。", "a": ["近隣にも声をかけ共に避難し必要なら通報する", "自分の身を守るため一人で先に避難していく", "状況をSNSで発信することだけに専念して知らせる"], "correct": 0, "exp": "共助の観点で近隣へ声かけ。ただし自分の安全確保が前提。"}, {"q": "大雨特別警報が出た。これはどういう状況か？", "a": ["いつもの雨と同じ程度でまだ余裕のある状況", "数十年に一度の重大な危険が差し迫っている状況", "雨のピークが過ぎてすでに安全になった状況"], "correct": 1, "exp": "特別警報は重大な災害の切迫。ただちに命を守る行動を。"}, {"q": "避難所も危険な場合の『緊急安全確保』でとる行動は？", "a": ["少しでも安全な遠くの避難所まで移動して逃げる", "建物の外に出て救助隊が来るのを待って過ごす", "その場で最も安全な高く斜面から遠い場所へ移る"], "correct": 2, "exp": "警戒レベル5相当。移動が危険なら建物内の高く斜面から遠い場所へ。"}, {"q": "土砂災害から避難後、雨がやんだ。すぐ帰宅してよい？", "a": ["地盤が不安定なため安全確認まで自宅に戻らない", "雨がやんだので安心してすぐに自宅へ帰宅する", "斜面の様子を自分で見て崩れないか判断して戻る"], "correct": 0, "exp": "雨後も崩壊の危険は残る。行政の安全確認・解除を待つ。"}, {"q": "防災士が土砂災害訓練で最も重視すべき点は？", "a": ["斜面の土や岩を採取して専門的に分析すること", "前兆の知識と早めに避難を決める判断力を養うこと", "過去に起きた災害の年表や発生地を暗記すること"], "correct": 1, "exp": "前兆を知り、ためらわず早期避難できる判断力の育成が要。"}, {"q": "土砂災害の3種類として正しい組み合わせは？", "a": ["洪水・高潮・津波という水に関わる現象", "雪崩・落石・噴火という斜面や山の現象", "がけ崩れ・土石流・地すべりの三つの現象"], "correct": 2, "exp": "土砂災害は主にがけ崩れ・土石流・地すべりの3種。"}, {"q": "地すべりの前兆として正しいのは？", "a": ["地面のひび割れや段差ができ井戸水が濁る", "雨雲が去って急に青空が広がり気温が上がる", "川の流れが澄んで水位がゆっくり下がっていく"], "correct": 0, "exp": "地割れ・段差・地下水の変化などが前兆。"}, {"q": "土石流の速さの目安として正しいのは？", "a": ["歩く程度の速さでゆっくりと迫ってくる", "時速数十kmと自動車並みで非常に速い", "ほとんど動かずその場に留まり続ける"], "correct": 1, "exp": "土石流は非常に速く逃げ切れないことも。前兆段階での早期避難が命を守る。"}, {"q": "大雨時、山際の家で就寝前に確認すべきことは？", "a": ["空気を入れ替えるため部屋の窓を大きく開けておく", "崩れる前兆がないか自分で斜面を見に行って確かめる", "避難情報やキキクルを見てすぐ逃げられる準備をする"], "correct": 2, "exp": "夜間の急変に備え情報確認と持ち出し準備。斜面に近づかない。"}, {"q": "土砂災害警戒区域（イエロー）に住む。平時の備えは？", "a": ["避難経路や避難先を確認し早期避難を家族で共有する", "危険とされていても特に気にせず日常を過ごす", "対策は雨が降っている当日に考えれば十分である"], "correct": 0, "exp": "区域内は早めの避難が原則。平時の共有が有事の行動を決める。"}, {"q": "斜面の擁壁から急に濁った水が噴き出した。", "a": ["念のため水の成分を調べてから対応を考える", "崩壊の前兆とみてただちに離れて避難する", "記録として写真だけ撮ってその場を立ち去る"], "correct": 1, "exp": "湧水の急増・濁りは崩壊の兆候。ただちに離れて避難。"}, {"q": "土砂災害で道路が寸断。孤立集落での防災士の役割は？", "a": ["装備がなくても単独で救助のため現場へ向かう", "救助が来るまで特に何もせずその場で待ち続ける", "安否確認と情報の集約、救助要請などの後方支援"], "correct": 2, "exp": "孤立時は正確な情報の集約・伝達が救助につながる。無理な単独行動は危険。"}, {"q": "避難が間に合わず屋内にとどまる場合の垂直避難は？", "a": ["斜面と反対側の2階以上の部屋へ移動する", "崩れが来にくいと考えて斜面側の1階へ移る", "浸水を避けるため地下の部屋へ下りて隠れる"], "correct": 0, "exp": "崩落は斜面側から。反対側の高い部屋で少しでも安全性を高める。"}, {"q": "『土砂災害警戒情報』と『大雨警報』の関係は？", "a": ["大雨警報のほうが常に危険度が高い発表である", "警戒情報のほうが命に直結する切迫度が高い", "両者は互いに関係のない別々の情報である"], "correct": 1, "exp": "土砂災害警戒情報は危険度がさらに高い。区域内は即避難。"}, {"q": "盛土や造成地について注意すべきことは？", "a": ["しっかり固められているので絶対に崩れず安全", "水はけが良いため災害の心配はほとんどない", "豪雨や地震で崩れやすい場合があり注意が必要"], "correct": 2, "exp": "不適切な盛土は崩壊リスク。ハザード情報や地形を確認。"}, {"q": "避難のタイミングで防災士が住民に伝えるべきは？", "a": ["前兆や警戒情報の段階で空振りを恐れず早めに動く", "確実さを重視して被害が出るのを見てから動く", "混乱を避けるため近所の動きに合わせて避難する"], "correct": 0, "exp": "早すぎるくらいでちょうどよい。ためらいが逃げ遅れを生む。"}, {"q": "土砂災害から避難する際の服装・装備で適切なのは？", "a": ["足さばきのよいサンダルと雨をしのぐ傘だけを持つ", "動きやすい服と底の厚い靴、頭を守るヘッドライト", "当面の生活のため重い荷物を背負って避難する"], "correct": 1, "exp": "両手を空け、足元と頭を守る装備。夜間はライトが必須。"}, {"q": "山鳴りや立木の裂ける音が聞こえた。これは？", "a": ["近くに , "correct": 2, "exp": "予測段階での早期準備が命を守る。空振りを恐れず呼びかける。"}, {"q": "豪雨災害後、水が引いた家屋で最初に注意すべきは？", "a": ["感電やガス漏れ、汚泥やカビなど衛生の危険に備える", "停電の復旧を確かめるためすぐに電気をつけて確認する", "片付けを急ぐため素手で泥をかき出して掃除を始める"], "correct": 0, "exp": "通電・ガス漏れ・感染の危険。安全確認と防護装備のうえで作業する。"}]}}};
const N_ASK = 10; // 出題数

// スプレッドシート＋GASを設置したら、下の '' に「ウェブアプリのURL」を貼り付けてください。
// 空のままなら、この端末内だけのランキングで動作します（設置前でも壊れません）。
var GAS_URL = 'https://script.google.com/macros/s/AKfycbyNiLh6KALGq8RgSsamnNm3bP39y9zLnAm99Y6TrwRt-n2F_WuTgt4nMuiKsPs8-2DE/exec';

// ---- localStorage ラッパ（埋め込み環境では無効でもエラーにしない） ----
function lsGet(k){ try{ return JSON.parse(localStorage.getItem(k)); }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }

let state = {};
const main = document.getElementById('main');

function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

// ===== スタート画面 =====
function renderStart(){
  let cats = '';
  Object.keys(DATA.cats).forEach(key=>{
    const c=DATA.cats[key];
    const best=lsGet('sct_best_'+key);
    const bestTxt = best ? ('ベスト '+fmtTime(best.time)+'／'+best.score+'問正解') : '未挑戦';
    cats += `<button class="cat-btn" onclick="startQuiz('${key}')">
      <span class="ic">${c.icon}</span><span class="nm">${c.name}</span><span class="best">${bestTxt}</span></button>`;
  });
  main.innerHTML = `
    <p class="lead">カテゴリーを選び、<b>10問</b>の状況判断に挑戦。<br><b>速く・正確に</b>答えるほど高評価。タイムが記録され、ランキングされます。</p>
    <div class="cats">${cats}</div>
    <div style="margin-top:16px">
      <button class="btn btn-ghost" onclick="renderRankingSelect()">🏆 ランキングを見る</button>
    </div>`;
}

// ===== 出題開始 =====
function startQuiz(catKey){
  const c=DATA.cats[catKey];
  const pool=c.questions.map((q,i)=>({...q,_cat:c.name}));
  shuffle(pool);
  const picked=pool.slice(0, Math.min(N_ASK, pool.length));
  // 各問の選択肢もシャッフル（正解位置を追従）
  const qs=picked.map(q=>{
    const idx=[0,1,2]; shuffle(idx);
    const opts=idx.map(i=>q.a[i]);
    const correct=idx.indexOf(q.correct);
    return {q:q.q, a:opts, correct, exp:q.exp};
  });
  state={catKey, catName:c.name, qs, cur:0, correct:0, startAt:Date.now(), elapsed:0, timerId:null, answers:[]};
  state.timerId=setInterval(tick,100);
  renderQuestion();
}

function tick(){
  state.elapsed = (Date.now()-state.startAt)/1000;
  const t=document.getElementById('timer');
  if(t) t.textContent=fmtTime(state.elapsed);
}

function renderQuestion(){
  const i=state.cur, q=state.qs[i];
  main.innerHTML = `
    <div class="quiz-top">
      <span class="prog">${state.catName}　第 ${i+1} / ${state.qs.length} 問</span>
      <span class="timer" id="timer">${fmtTime(state.elapsed)}</span>
    </div>
    <div class="barwrap"><span style="width:${i/state.qs.length*100}%"></span></div>
    <div class="card">
      <span class="qcat">状況判断</span>
      <div class="qtext">${q.q}</div>
      <div class="opts" id="opts">
        ${q.a.map((o,idx)=>`<button class="opt" onclick="answer(${idx})">
          <span class="lb">${'ABC'[idx]}</span><span>${o}</span></button>`).join('')}
      </div>
      <div class="exp" id="exp"></div>
      <div class="next-wrap" id="nextwrap">
        <button class="btn btn-teal" onclick="nextQ()">${i+1<state.qs.length?'次の問題 ▶':'結果を見る 🏁'}</button>
      </div>
    </div>`;
}

function answer(sel){
  const q=state.qs[state.cur];
  const opts=document.querySelectorAll('#opts .opt');
  opts.forEach((b,idx)=>{
    b.disabled=true;
    if(idx===q.correct) b.classList.add('correct');
    if(idx===sel && sel!==q.correct) b.classList.add('wrong');
  });
  const ok = sel===q.correct;
  if(ok) state.correct++;
  state.answers.push({q:q.q, correct:q.a[q.correct], chosen:q.a[sel], ok});
  const exp=document.getElementById('exp');
  exp.innerHTML = `<div class="verdict ${ok?'ok':'ng'}">${ok?'◎ 正解':'✕ 不正解'}</div>${q.exp}`;
  exp.classList.add('show');
  document.getElementById('nextwrap').classList.add('show');
}

function nextQ(){
  if(state.cur+1 < state.qs.length){ state.cur++; renderQuestion(); }
  else finishQuiz();
}

function finishQuiz(){
  clearInterval(state.timerId);
  const time=state.elapsed, score=state.correct, total=state.qs.length;
  // 記録（全問正解のときのみベストタイム更新の対象。部分正解も記録は残す）
  saveRecord(state.catKey, score, total, time);
  renderResult(score, total, time);
}

// ===== 結果画面 =====
function renderResult(score, total, time){
  const perfect = score===total;
  const best=lsGet('sct_best_'+state.catKey);
  let rankMsg='';
  if(perfect){
    rankMsg = `<div class="rank-badge" style="color:var(--green)">🎉 全問正解！ タイム ${fmtTime(time)}</div>`;
  }else{
    rankMsg = `<div class="rank-badge" style="color:var(--amber)">正確さがカギ。全問正解でランキング上位を目指そう</div>`;
  }
  const review = state.answers.map(a=>`
    <div class="rv">
      <div class="rvq">${a.ok?'◎':'✕'} ${a.q}</div>
      ${a.ok?`<div class="rva">正解：${a.correct}</div>`
            :`<div class="rvx">あなた：${a.chosen}</div><div class="rva">正解：${a.correct}</div>`}
    </div>`).join('');
  main.innerHTML = `
    <div class="card">
      <div class="result-hero">
        <div class="lbl">${state.catName}</div>
        <div class="big">${score}<small>/${total} 問正解</small></div>
        <div class="time">⏱ ${fmtTime(time)}</div>
      </div>
      ${rankMsg}
      <button class="btn btn-primary" onclick="promptNameAndRank(${score},${total},${time})">🏆 ランキングに登録</button>
      <div style="height:8px"></div>
      <button class="btn btn-teal" onclick="startQuiz('${state.catKey}')">もう一度挑戦</button>
      <div style="height:8px"></div>
      <button class="btn btn-ghost" onclick="renderStart()">カテゴリー選択に戻る</button>
    </div>
    <div class="review">
      <h3>解答のふり返り</h3>
      ${review}
    </div>`;
}

// ===== 記録・ランキング =====
function saveRecord(catKey, score, total, time){
  // ベスト（全問正解のうち最速）
  if(score===total){
    const best=lsGet('sct_best_'+catKey);
    if(!best || time<best.time){ lsSet('sct_best_'+catKey, {time, score, at:Date.now()}); }
  }
}
function promptNameAndRank(score,total,time){
  const perfect=score===total;
  main.innerHTML = `
    <div class="card">
      <h3 style="font-size:16px;color:var(--navy);margin-bottom:6px">ランキング登録</h3>
      <p style="font-size:13px;color:var(--sub);margin-bottom:6px">
        ${state.catName}／${score}/${total}問・${fmtTime(time)}<br>
        ${perfect?'全問正解！ タイムでランキングされます。':'※ランキングは全問正解者をタイム順に掲載します。今回は記録として残ります。'}
      </p>
      <input class="namein" id="namein" maxlength="12" placeholder="ニックネーム（12文字まで）">
      <button class="btn btn-primary" onclick="doRank(${score},${total},${time})">登録する</button>
      <div style="height:8px"></div>
      <button class="btn btn-ghost" onclick="renderResult(${score},${total},${time})">戻る</button>
    </div>`;
}
function doRank(score,total,time){
  const nm=(document.getElementById('namein').value||'名無しの防災士').slice(0,12);
  if(GAS_URL){
    // 全国ランキング：スプレッドシートへ送信
    const body=new URLSearchParams({name:nm, cat:state.catKey, score:String(score), total:String(total), time:String(time)});
    // 画面を「送信中」に
    document.querySelector('.card').innerHTML='<div style="text-align:center;padding:20px;color:var(--sub)">全国ランキングに登録中…</div>';
    fetch(GAS_URL, {method:'POST', body})
      .then(function(){ renderRanking(state.catKey, nm+'|'+time); })
      .catch(function(){
        // 通信失敗時は端末内に保存してフォールバック
        saveLocalRank(nm,score,total,time);
        renderRanking(state.catKey, nm+'|'+time);
      });
    return;
  }
  // 端末内ランキング
  saveLocalRank(nm,score,total,time);
  renderRanking(state.catKey, nm+'|'+time);
}
function saveLocalRank(nm,score,total,time){
  const key='sct_rank_'+state.catKey;
  const list=lsGet(key)||[];
  list.push({name:nm, score, total, time, perfect:score===total, at:Date.now()});
  list.sort((a,b)=>{
    if(a.perfect!==b.perfect) return a.perfect?-1:1;
    if(a.perfect&&b.perfect) return a.time-b.time;
    if(a.score!==b.score) return b.score-a.score;
    return a.time-b.time;
  });
  lsSet(key, list.slice(0,50));
}
function renderRankingSelect(){
  let cats='';
  Object.keys(DATA.cats).forEach(key=>{
    const c=DATA.cats[key];
    cats+=`<button class="cat-btn" onclick="renderRanking('${key}')"><span class="ic">${c.icon}</span><span class="nm">${c.name}</span></button>`;
  });
  main.innerHTML=`<p class="lead">ランキングを見るカテゴリーを選んでください。</p><div class="cats">${cats}</div>
    <div style="margin-top:16px"><button class="btn btn-ghost" onclick="renderStart()">戻る</button></div>`;
}
function renderRanking(catKey, highlight){
  const c=DATA.cats[catKey];
  if(GAS_URL){
    main.innerHTML='<div class="card"><div style="text-align:center;padding:20px;color:var(--sub)">全国ランキングを読み込み中…</div></div>';
    fetch(GAS_URL+'?cat='+encodeURIComponent(catKey))
      .then(function(r){return r.json();})
      .then(function(list){ drawRanking(catKey, list||[], highlight, true); })
      .catch(function(){
        // 失敗時は端末内を表示
        drawRanking(catKey, lsGet('sct_rank_'+catKey)||[], highlight, false);
      });
    return;
  }
  drawRanking(catKey, lsGet('sct_rank_'+catKey)||[], highlight, false);
}
function drawRanking(catKey, list, highlight, national){
  const c=DATA.cats[catKey];
  let rows='';
  if(!list || list.length===0){
    rows=`<tr><td colspan="4"><div class="empty">まだ記録がありません。<br>挑戦して1位を目指しましょう！</div></td></tr>`;
  }else{
    list.slice(0,20).forEach((r,i)=>{
      const isMe = highlight && (r.name+'|'+r.time)===highlight;
      rows+=`<tr class="${isMe?'me':''}">
        <td class="rk">${i+1}</td>
        <td>${r.name}${r.perfect?'':' <span style="color:var(--sub);font-size:11px">('+r.score+'/'+r.total+')</span>'}</td>
        <td class="t">${fmtTime(r.time)}</td>
        <td style="font-size:11px;color:var(--sub)">${r.perfect?'全問正解':''}</td>
      </tr>`;
    });
  }
  const scope = national ? '🌐 全国ランキング' : '📱 この端末のランキング';
  main.innerHTML=`
    <div class="card">
      <h3 style="font-size:16px;color:var(--navy);margin-bottom:2px">${c.icon} ${c.name}　ランキング</h3>
      <p style="font-size:11.5px;color:var(--sub);margin-bottom:8px">${scope}／全問正解者をタイムの速い順に掲載</p>
      <table class="rank-table">
        <thead><tr><th>順位</th><th>名前</th><th>タイム</th><th></th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
    <button class="btn btn-teal" onclick="startQuiz('${catKey}')">このカテゴリーに挑戦</button>
    <div style="height:8px"></div>
    <button class="btn btn-ghost" onclick="renderStart()">トップに戻る</button>`;
}

function fmtTime(sec){
  sec=Number(sec)||0;
  const m=Math.floor(sec/60), s=Math.floor(sec%60), ms=Math.floor((sec*10)%10);
  return (m>0? m+'分' : '') + s + '.' + ms + '秒';
}

renderStart();
</script>
</body>
</html>
