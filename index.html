<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SCT ― 状況判断訓練ツール｜防災士向け</title>
<meta name="description" content="Speed & Correct Trainer（SCT）。防災士向けの状況判断訓練ツール。災害別の状況判断を、速く正確に。">
<style>
  :root{
    --ink:#16212b; --sub:#5b6b78; --line:#dbe3ea; --bg:#eef2f5; --panel:#ffffff;
    --navy:#0f2c4a; --navy2:#173e63; --teal:#2f7d78; --flame:#e8541e; --green:#1f9d57; --red:#d24b3e; --amber:#e0902a;
    --shadow:0 4px 16px rgba(20,45,70,.10);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;color:var(--ink);background:var(--bg);line-height:1.7}
  .wrap{max-width:720px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
  header{background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;padding:16px 20px;text-align:center}
  header .en{font-size:11px;letter-spacing:.22em;color:#9fd0cc;font-weight:700}
  header h1{font-size:20px;font-weight:800;margin:2px 0 3px;letter-spacing:.04em}
  header .jp{font-size:12px;color:#cfe0ea}
  header .abbr{color:var(--flame);font-weight:900}
  main{flex:1;padding:18px 16px 40px}

  /* 共通 */
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:18px;margin-bottom:14px}
  .btn{display:block;width:100%;border:0;border-radius:11px;padding:15px;font-size:16px;font-weight:800;cursor:pointer;font-family:inherit;transition:.12s}
  .btn:active{transform:scale(.98)}
  .btn-primary{background:var(--navy);color:#fff}
  .btn-teal{background:var(--teal);color:#fff}
  .btn-ghost{background:#fff;border:1.5px solid var(--line);color:var(--ink)}

  /* スタート画面：カテゴリー */
  .lead{font-size:13.5px;color:var(--sub);text-align:center;margin-bottom:16px;line-height:1.8}
  .cats{display:grid;grid-template-columns:1fr 1fr;gap:11px}
  .cat-btn{display:flex;flex-direction:column;align-items:center;gap:6px;background:var(--panel);border:1.5px solid var(--line);border-radius:14px;padding:18px 10px;cursor:pointer;font-family:inherit;transition:.12s}
  .cat-btn:hover{border-color:var(--teal)}
  .cat-btn:active{transform:scale(.97)}
  .cat-btn .ic{font-size:30px}
  .cat-btn .nm{font-size:14px;font-weight:800;color:var(--navy)}
  .cat-btn .best{font-size:10.5px;color:var(--sub)}
  .cat-btn.all{grid-column:1 / -1;background:linear-gradient(135deg,var(--flame),#c0561f);border-color:transparent;color:#fff}
  .cat-btn.all .nm{color:#fff}
  .cat-btn.all .best{color:#ffe6da}

  /* 出題画面 */
  .quiz-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
  .quiz-top .prog{font-size:13px;font-weight:800;color:var(--navy)}
  .quiz-top .timer{font-variant-numeric:tabular-nums;font-size:20px;font-weight:900;color:var(--flame);background:#fff;border:1.5px solid var(--line);border-radius:9px;padding:4px 12px}
  .barwrap{height:7px;background:var(--line);border-radius:4px;overflow:hidden;margin-bottom:16px}
  .barwrap span{display:block;height:100%;background:var(--teal);width:0;transition:width .3s}
  .qcat{display:inline-block;font-size:11px;font-weight:800;color:var(--teal);background:#e7f4f2;border-radius:20px;padding:3px 11px;margin-bottom:10px}
  .qtext{font-size:16.5px;font-weight:700;line-height:1.7;color:var(--ink);margin-bottom:16px}
  .opts{display:flex;flex-direction:column;gap:10px}
  .opt{display:flex;align-items:flex-start;gap:11px;background:#fff;border:1.5px solid var(--line);border-radius:11px;padding:13px 14px;cursor:pointer;text-align:left;font-family:inherit;font-size:14.5px;line-height:1.6;transition:.12s}
  .opt:hover{border-color:var(--teal)}
  .opt .lb{flex:none;width:26px;height:26px;border-radius:50%;background:var(--navy);color:#fff;font-weight:800;font-size:14px;display:flex;align-items:center;justify-content:center}
  .opt.correct{border-color:var(--green);background:#eafaf0}
  .opt.correct .lb{background:var(--green)}
  .opt.wrong{border-color:var(--red);background:#fdeeec}
  .opt.wrong .lb{background:var(--red)}
  .opt:disabled{cursor:default}
  .exp{margin-top:14px;background:#f6f9fb;border-left:4px solid var(--teal);border-radius:8px;padding:12px 14px;font-size:13.5px;line-height:1.75;color:#2a3540;display:none}
  .exp.show{display:block}
  .exp .verdict{font-weight:800;margin-bottom:5px}
  .exp .verdict.ok{color:var(--green)}
  .exp .verdict.ng{color:var(--red)}
  .next-wrap{margin-top:14px;display:none}
  .next-wrap.show{display:block}

  /* 結果画面 */
  .result-hero{text-align:center;padding:8px 0 4px}
  .result-hero .big{font-size:40px;font-weight:900;color:var(--navy);font-variant-numeric:tabular-nums}
  .result-hero .big small{font-size:18px;color:var(--sub)}
  .result-hero .time{font-size:22px;font-weight:900;color:var(--flame);font-variant-numeric:tabular-nums;margin-top:2px}
  .result-hero .lbl{font-size:12px;color:var(--sub)}
  .score-line{display:flex;justify-content:center;gap:20px;margin:14px 0}
  .score-line .b{text-align:center}
  .score-line .b .v{font-size:22px;font-weight:900}
  .score-line .b .v.ok{color:var(--green)}
  .score-line .b .v.ng{color:var(--red)}
  .score-line .b .k{font-size:11px;color:var(--sub)}
  .rank-badge{text-align:center;font-size:15px;font-weight:800;margin:6px 0 12px}
  .review{margin-top:8px}
  .review h3{font-size:13px;color:var(--sub);font-weight:800;margin:14px 0 8px}
  .rv{background:#fff;border:1px solid var(--line);border-radius:10px;padding:11px 13px;margin-bottom:8px;font-size:13px}
  .rv .rvq{font-weight:700;margin-bottom:4px}
  .rv .rva{color:var(--green);font-size:12.5px}
  .rv .rvx{color:var(--red);font-size:12.5px}

  /* ランキング */
  .rank-table{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px}
  .rank-table th,.rank-table td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left}
  .rank-table th{color:var(--sub);font-size:11px;font-weight:700}
  .rank-table .rk{font-weight:900;color:var(--navy);width:36px}
  .rank-table .me{background:#fff7 e6}
  .rank-table td.t{font-variant-numeric:tabular-nums;font-weight:800}
  .empty{color:var(--sub);font-size:13px;text-align:center;padding:16px}

  .foot{font-size:11px;color:var(--sub);text-align:center;padding:16px;line-height:1.7}
  .hide{display:none}
  .namein{width:100%;border:1.5px solid var(--line);border-radius:9px;padding:11px;font-size:15px;font-family:inherit;margin:8px 0}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="en">SPEED &amp; CORRECT TRAINER</div>
    <h1><span class="abbr">SCT</span> ― 状況判断訓練ツール</h1>
    <div class="jp">防災士のための、速く正確な判断力トレーニング</div>
  </header>
  <main id="main"></main>
  <div class="foot">
    出題は各カテゴリー20問からランダムに10問。選択肢の並びも毎回変わります。<br>
    ※本ツールは訓練用です。実際の災害時は必ず気象庁・自治体等の最新情報に従ってください。
  </div>
</div>

<script>

const N_ASK = 10; // 出題数

var GAS_URL = 'https://script.google.com/macros/s/AKfycbyNiLh6KALGq8RgSsamnNm3bP39y9zLnAm99Y6TrwRt-n2F_WuTgt4nMuiKsPs8-2DE/exec';

// ---- localStorage ラッパ（埋め込み環境では無効でもエラーにしない） ----
function lsGet(k){ try{ return JSON.parse(localStorage.getItem(k)); }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }

let state = {};
const main = document.getElementById('main');

function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

// ===== スタート画面 =====
function renderStart(){
  let cats = '';
  Object.keys(DATA.cats).forEach(key=>{
    const c=DATA.cats[key];
    const best=lsGet('sct_best_'+key);
    const bestTxt = best ? ('ベスト '+fmtTime(best.time)+'／'+best.score+'問正解') : '未挑戦';
    cats += `<button class="cat-btn" onclick="startQuiz('${key}')">
      <span class="ic">${c.icon}</span><span class="nm">${c.name}</span><span class="best">${bestTxt}</span></button>`;
  });
  main.innerHTML = `
    <p class="lead">カテゴリーを選び、<b>10問</b>の状況判断に挑戦。<br><b>速く・正確に</b>答えるほど高評価。タイムが記録され、ランキングされます。</p>
    <div class="cats">${cats}</div>
    <div style="margin-top:16px">
      <button class="btn btn-ghost" onclick="renderRankingSelect()">🏆 ランキングを見る</button>
    </div>`;
}

// ===== 出題開始 =====
function startQuiz(catKey){
  const c=DATA.cats[catKey];
  const pool=c.questions.map((q,i)=>({...q,_cat:c.name}));
  shuffle(pool);
  const picked=pool.slice(0, Math.min(N_ASK, pool.length));
  // 各問の選択肢もシャッフル（正解位置を追従）
  const qs=picked.map(q=>{
    const idx=[0,1,2]; shuffle(idx);
    const opts=idx.map(i=>q.a[i]);
    const correct=idx.indexOf(q.correct);
    return {q:q.q, a:opts, correct, exp:q.exp};
  });
  state={catKey, catName:c.name, qs, cur:0, correct:0, startAt:Date.now(), elapsed:0, timerId:null, answers:[]};
  state.timerId=setInterval(tick,100);
  renderQuestion();
}

function tick(){
  state.elapsed = (Date.now()-state.startAt)/1000;
  const t=document.getElementById('timer');
  if(t) t.textContent=fmtTime(state.elapsed);
}

function renderQuestion(){
  const i=state.cur, q=state.qs[i];
  main.innerHTML = `
    <div class="quiz-top">
      <span class="prog">${state.catName}　第 ${i+1} / ${state.qs.length} 問</span>
      <span class="timer" id="timer">${fmtTime(state.elapsed)}</span>
    </div>
    <div class="barwrap"><span style="width:${i/state.qs.length*100}%"></span></div>
    <div class="card">
      <span class="qcat">状況判断</span>
      <div class="qtext">${q.q}</div>
      <div class="opts" id="opts">
        ${q.a.map((o,idx)=>`<button class="opt" onclick="answer(${idx})">
          <span class="lb">${'ABC'[idx]}</span><span>${o}</span></button>`).join('')}
      </div>
      <div class="exp" id="exp"></div>
      <div class="next-wrap" id="nextwrap">
        <button class="btn btn-teal" onclick="nextQ()">${i+1<state.qs.length?'次の問題 ▶':'結果を見る 🏁'}</button>
      </div>
    </div>`;
}

function answer(sel){
  const q=state.qs[state.cur];
  const opts=document.querySelectorAll('#opts .opt');
  opts.forEach((b,idx)=>{
    b.disabled=true;
    if(idx===q.correct) b.classList.add('correct');
    if(idx===sel && sel!==q.correct) b.classList.add('wrong');
  });
  const ok = sel===q.correct;
  if(ok) state.correct++;
  state.answers.push({q:q.q, correct:q.a[q.correct], chosen:q.a[sel], ok});
  const exp=document.getElementById('exp');
  exp.innerHTML = `<div class="verdict ${ok?'ok':'ng'}">${ok?'◎ 正解':'✕ 不正解'}</div>${q.exp}`;
  exp.classList.add('show');
  document.getElementById('nextwrap').classList.add('show');
}

function nextQ(){
  if(state.cur+1 < state.qs.length){ state.cur++; renderQuestion(); }
  else finishQuiz();
}

function finishQuiz(){
  clearInterval(state.timerId);
  const time=state.elapsed, score=state.correct, total=state.qs.length;
  // 記録（全問正解のときのみベストタイム更新の対象。部分正解も記録は残す）
  saveRecord(state.catKey, score, total, time);
  renderResult(score, total, time);
}

// ===== 結果画面 =====
function renderResult(score, total, time){
  const perfect = score===total;
  const best=lsGet('sct_best_'+state.catKey);
  let rankMsg='';
  if(perfect){
    rankMsg = `<div class="rank-badge" style="color:var(--green)">🎉 全問正解！ タイム ${fmtTime(time)}</div>`;
  }else{
    rankMsg = `<div class="rank-badge" style="color:var(--amber)">正確さがカギ。全問正解でランキング上位を目指そう</div>`;
  }
  const review = state.answers.map(a=>`
    <div class="rv">
      <div class="rvq">${a.ok?'◎':'✕'} ${a.q}</div>
      ${a.ok?`<div class="rva">正解：${a.correct}</div>`
            :`<div class="rvx">あなた：${a.chosen}</div><div class="rva">正解：${a.correct}</div>`}
    </div>`).join('');
  main.innerHTML = `
    <div class="card">
      <div class="result-hero">
        <div class="lbl">${state.catName}</div>
        <div class="big">${score}<small>/${total} 問正解</small></div>
        <div class="time">⏱ ${fmtTime(time)}</div>
      </div>
      ${rankMsg}
      <button class="btn btn-primary" onclick="promptNameAndRank(${score},${total},${time})">🏆 ランキングに登録</button>
      <div style="height:8px"></div>
      <button class="btn btn-teal" onclick="startQuiz('${state.catKey}')">もう一度挑戦</button>
      <div style="height:8px"></div>
      <button class="btn btn-ghost" onclick="renderStart()">カテゴリー選択に戻る</button>
    </div>
    <div class="review">
      <h3>解答のふり返り</h3>
      ${review}
    </div>`;
}

// ===== 記録・ランキング =====
function saveRecord(catKey, score, total, time){
  // ベスト（全問正解のうち最速）
  if(score===total){
    const best=lsGet('sct_best_'+catKey);
    if(!best || time<best.time){ lsSet('sct_best_'+catKey, {time, score, at:Date.now()}); }
  }
}
function promptNameAndRank(score,total,time){
  const perfect=score===total;
  main.innerHTML = `
    <div class="card">
      <h3 style="font-size:16px;color:var(--navy);margin-bottom:6px">ランキング登録</h3>
      <p style="font-size:13px;color:var(--sub);margin-bottom:6px">
        ${state.catName}／${score}/${total}問・${fmtTime(time)}<br>
        ${perfect?'全問正解！ タイムでランキングされます。':'※ランキングは全問正解者をタイム順に掲載します。今回は記録として残ります。'}
      </p>
      <input class="namein" id="namein" maxlength="12" placeholder="ニックネーム（12文字まで）">
      <button class="btn btn-primary" onclick="doRank(${score},${total},${time})">登録する</button>
      <div style="height:8px"></div>
      <button class="btn btn-ghost" onclick="renderResult(${score},${total},${time})">戻る</button>
    </div>`;
}
function doRank(score,total,time){
  const nm=(document.getElementById('namein').value||'名無しの防災士').slice(0,12);
  if(GAS_URL){
    // 全国ランキング：スプレッドシートへ送信
    const body=new URLSearchParams({name:nm, cat:state.catKey, score:String(score), total:String(total), time:String(time)});
    // 画面を「送信中」に
    document.querySelector('.card').innerHTML='<div style="text-align:center;padding:20px;color:var(--sub)">全国ランキングに登録中…</div>';
    fetch(GAS_URL, {method:'POST', body})
      .then(function(){ renderRanking(state.catKey, nm+'|'+time); })
      .catch(function(){
        // 通信失敗時は端末内に保存してフォールバック
        saveLocalRank(nm,score,total,time);
        renderRanking(state.catKey, nm+'|'+time);
      });
    return;
  }
  // 端末内ランキング
  saveLocalRank(nm,score,total,time);
  renderRanking(state.catKey, nm+'|'+time);
}
function saveLocalRank(nm,score,total,time){
  const key='sct_rank_'+state.catKey;
  const list=lsGet(key)||[];
  list.push({name:nm, score, total, time, perfect:score===total, at:Date.now()});
  list.sort((a,b)=>{
    if(a.perfect!==b.perfect) return a.perfect?-1:1;
    if(a.perfect&&b.perfect) return a.time-b.time;
    if(a.score!==b.score) return b.score-a.score;
    return a.time-b.time;
  });
  lsSet(key, list.slice(0,50));
}
function renderRankingSelect(){
  let cats='';
  Object.keys(DATA.cats).forEach(key=>{
    const c=DATA.cats[key];
    cats+=`<button class="cat-btn" onclick="renderRanking('${key}')"><span class="ic">${c.icon}</span><span class="nm">${c.name}</span></button>`;
  });
  main.innerHTML=`<p class="lead">ランキングを見るカテゴリーを選んでください。</p><div class="cats">${cats}</div>
    <div style="margin-top:16px"><button class="btn btn-ghost" onclick="renderStart()">戻る</button></div>`;
}
function renderRanking(catKey, highlight){
  const c=DATA.cats[catKey];
  if(GAS_URL){
    main.innerHTML='<div class="card"><div style="text-align:center;padding:20px;color:var(--sub)">全国ランキングを読み込み中…</div></div>';
    fetch(GAS_URL+'?cat='+encodeURIComponent(catKey))
      .then(function(r){return r.json();})
      .then(function(list){ drawRanking(catKey, list||[], highlight, true); })
      .catch(function(){
        // 失敗時は端末内を表示
        drawRanking(catKey, lsGet('sct_rank_'+catKey)||[], highlight, false);
      });
    return;
  }
  drawRanking(catKey, lsGet('sct_rank_'+catKey)||[], highlight, false);
}
function drawRanking(catKey, list, highlight, national){
  const c=DATA.cats[catKey];
  let rows='';
  if(!list || list.length===0){
    rows=`<tr><td colspan="4"><div class="empty">まだ記録がありません。<br>挑戦して1位を目指しましょう！</div></td></tr>`;
  }else{
    list.slice(0,20).forEach((r,i)=>{
      const isMe = highlight && (r.name+'|'+r.time)===highlight;
      rows+=`<tr class="${isMe?'me':''}">
        <td class="rk">${i+1}</td>
        <td>${r.name}${r.perfect?'':' <span style="color:var(--sub);font-size:11px">('+r.score+'/'+r.total+')</span>'}</td>
        <td class="t">${fmtTime(r.time)}</td>
        <td style="font-size:11px;color:var(--sub)">${r.perfect?'全問正解':''}</td>
      </tr>`;
    });
  }
  const scope = national ? '🌐 全国ランキング' : '📱 この端末のランキング';
  main.innerHTML=`
    <div class="card">
      <h3 style="font-size:16px;color:var(--navy);margin-bottom:2px">${c.icon} ${c.name}　ランキング</h3>
      <p style="font-size:11.5px;color:var(--sub);margin-bottom:8px">${scope}／全問正解者をタイムの速い順に掲載</p>
      <table class="rank-table">
        <thead><tr><th>順位</th><th>名前</th><th>タイム</th><th></th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
    <button class="btn btn-teal" onclick="startQuiz('${catKey}')">このカテゴリーに挑戦</button>
    <div style="height:8px"></div>
    <button class="btn btn-ghost" onclick="renderStart()">トップに戻る</button>`;
}

function fmtTime(sec){
  sec=Number(sec)||0;
  const m=Math.floor(sec/60), s=Math.floor(sec%60), ms=Math.floor((sec*10)%10);
  return (m>0? m+'分' : '') + s + '.' + ms + '秒';
}

renderStart();
</script>
</body>
</html>
